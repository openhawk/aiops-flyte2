apiVersion: v1
kind: Namespace
metadata:
  name: registry-system
  labels:
    app.kubernetes.io/name: cluster-registry
    app.kubernetes.io/part-of: aiops-infrastructure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry
  namespace: registry-system
  labels:
    app.kubernetes.io/name: cluster-registry
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config-ro
  namespace: registry-system
  labels:
    app.kubernetes.io/name: cluster-registry
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: cluster-registry
    storage:
      cache:
        blobdescriptor: inmemory
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: false
      maintenance:
        readonly:
          enabled: true
        uploadpurging:
          enabled: true
          age: 168h
          interval: 24h
          dryrun: false
    http:
      addr: :5000
      headers:
        X-Content-Type-Options:
          - nosniff
        Docker-Distribution-Api-Version:
          - registry/2.0
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config-rw
  namespace: registry-system
  labels:
    app.kubernetes.io/name: cluster-registry
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: cluster-registry
    storage:
      cache:
        blobdescriptor: inmemory
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: false
      maintenance:
        uploadpurging:
          enabled: true
          age: 168h
          interval: 24h
          dryrun: false
    http:
      addr: :5000
      headers:
        X-Content-Type-Options:
          - nosniff
        Docker-Distribution-Api-Version:
          - registry/2.0
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry-system
  labels:
    app.kubernetes.io/name: cluster-registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  storageClassName: bj1-ebs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry-system
  labels:
    app.kubernetes.io/name: cluster-registry
    app.kubernetes.io/version: 3.1.1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-registry
        app.kubernetes.io/version: 3.1.1
    spec:
      serviceAccountName: registry
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: aiops.fzyun.io/registry-host
                    operator: In
                    values:
                      - "true"
      tolerations:
        - key: aiops.fzyun.io/hostname
          operator: Exists
          effect: NoSchedule
      containers:
        - name: registry
          image: docker.ops.fzyun.io/library/registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
          imagePullPolicy: IfNotPresent
          args:
            - /etc/distribution/config.yml
          env:
            - name: OTEL_TRACES_EXPORTER
              value: none
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/distribution/config.yml
              subPath: config.yml
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: config
          configMap:
            name: registry-config-ro
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry-system
  labels:
    app.kubernetes.io/name: cluster-registry
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cluster-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30000
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registry
  namespace: registry-system
  labels:
    app.kubernetes.io/name: cluster-registry
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-registry
