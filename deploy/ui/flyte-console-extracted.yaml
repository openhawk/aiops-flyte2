apiVersion: v1
kind: ServiceAccount
metadata:
  name: flyte-console-extracted
  namespace: flyte
  labels:
    app: flyte-console-extracted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flyte-console-extracted-dev-instances
  namespace: flyte
  labels:
    app: flyte-console-extracted
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "delete", "deletecollection"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete", "deletecollection"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flyte-console-extracted-dev-instances
  namespace: flyte
  labels:
    app: flyte-console-extracted
subjects:
  - kind: ServiceAccount
    name: flyte-console-extracted
    namespace: flyte
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flyte-console-extracted-dev-instances
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flyte-console-extracted-node-stats
  labels:
    app: flyte-console-extracted
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flyte-console-extracted-node-stats
  labels:
    app: flyte-console-extracted
subjects:
  - kind: ServiceAccount
    name: flyte-console-extracted
    namespace: flyte
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flyte-console-extracted-node-stats
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flyte-console-extracted-gpu-usage
  labels:
    app: flyte-console-extracted
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flyte-console-extracted-gpu-usage
  labels:
    app: flyte-console-extracted
subjects:
  - kind: ServiceAccount
    name: flyte-console-extracted
    namespace: flyte
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flyte-console-extracted-gpu-usage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyte-console-extracted
  namespace: flyte
  labels:
    app: flyte-console-extracted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flyte-console-extracted
  template:
    metadata:
      labels:
        app: flyte-console-extracted
    spec:
      serviceAccountName: flyte-console-extracted
      nodeSelector:
        kubernetes.io/hostname: aione-flyte2
      containers:
        - name: flyte-console-extracted
          image: docker.ops.fzyun.io/flyte-console-extracted:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: NEXT_PORT
              value: "3000"
            - name: FLYTE_API_ORIGIN
              value: http://flyte-binary-http:8090
            - name: HAWK_API_URL
              value: https://hawk.ops.fzyun.io
            - name: HAWK_PVC_HISTORY_DAYS
              value: "30"
            - name: HAWK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flyte-console-hawk
                  key: api-key
            - name: AIONE_PUBLIC_URL
              value: https://llm.ops.fzyun.io
            - name: LLM_KEYS_API_ORIGIN
              value: https://llm.ops.fzyun.io
            - name: LLM_KEYS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: new-api
                  key: api-token
            - name: UNION_ORG_OVERRIDE
              value: aione
            - name: EXTERNAL_API_FLYTE_ORG
              value: aione
            - name: EXTERNAL_API_DEFAULT_STORAGE_CLASS
              value: bj1-ebs
            - name: EXTERNAL_API_PUBLIC_SCHEME
              value: http
            - name: EXTERNAL_API_PUBLIC_HOST
              value: 172.19.66.218
            - name: EXTERNAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: flyte-console-external-api
                  key: api-keys
                  optional: true
            - name: EXTERNAL_API_DEFAULT_AUTHORIZED_KEY
              valueFrom:
                secretKeyRef:
                  name: flyte-console-external-api
                  key: authorized-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: flyte-console-extracted
  namespace: flyte
  labels:
    app: flyte-console-extracted
spec:
  type: NodePort
  selector:
    app: flyte-console-extracted
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flyte-console-flyte2
  namespace: flyte
spec:
  ingressClassName: traefik
  rules:
    - host: flyte2.ops.fzyun.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flyte-console-extracted
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: flyte-console-root-redirect
  namespace: flyte
spec:
  redirectRegex:
    regex: '^(https?://[^/]+)/$'
    replacement: '${1}/v2/projects'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flyte-console-flyte2-root
  namespace: flyte
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: flyte-flyte-console-root-redirect@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - host: flyte2.ops.fzyun.io
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: flyte-console-extracted
                port:
                  number: 80
